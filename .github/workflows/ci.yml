name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Train, test & benchmark (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train models (5-fold CV model selection)
        run: python -m src.pipeline.train_pipeline
      - name: Run tests
        run: pytest -v
        env:
          ASSISTANT_BACKEND: template
      - name: Latency benchmark
        run: python scripts/benchmark_latency.py --requests 500 --json latency.json
        env:
          ASSISTANT_PRELOAD: "0"
      - name: Upload model metrics & latency report
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: |
            artifacts/metrics.json
            latency.json

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
